services:
  postgres:
    image: postgres:16-alpine
    container_name: click-and-collect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickcollect
      POSTGRES_PASSWORD: clickcollect_dev_password
      POSTGRES_DB: clickcollect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: click-and-collect-prometheus
    restart: unless-stopped
    # Le backend NestJS n'est pas conteneurisé (npm run start:dev sur l'hôte) : Prometheus
    # doit donc pouvoir résoudre host.docker.internal pour l'atteindre (voir prometheus.yml).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: click-and-collect-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Secrets Slack/SMTP montés séparément (jamais commités, voir *.example) :
      # référencés via api_url_file / smtp_auth_password_file dans alertmanager.yml.
      - ./monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:latest
    container_name: click-and-collect-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Identifiants par défaut, uniquement pour le développement local — à remplacer
      # avant tout déploiement exposé.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 3000 est pris par admin-web (Next.js dev) et 3001 par le backend (voir .env) :
      # Grafana est exposé sur 3002 pour éviter toute collision.
      - "3002:3000"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
