services:
  postgres:
    image: postgres:16-alpine
    container_name: click-and-collect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickcollect
      POSTGRES_PASSWORD: clickcollect_dev_password
      POSTGRES_DB: clickcollect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
