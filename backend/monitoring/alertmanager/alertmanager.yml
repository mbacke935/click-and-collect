global:
  resolve_timeout: 5m
  # SMTP pour les alertes email (compatible Gmail avec un "mot de passe d'application").
  smtp_from: 'alertmanager@click-and-collect.local'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_auth_username: 'CHANGE_ME@gmail.com'
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # Alerte QrValidationFailureRateHigh (severity=critical, cf. alert-rules.yml) :
    # notification immédiate sur Slack + email.
    - matchers:
        - severity="critical"
      receiver: 'qr-critical'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'default'

  - name: 'qr-critical'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: '#alertes-click-and-collect'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
    email_configs:
      - to: 'CHANGE_ME@example.com'
        send_resolved: true
