global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: click-and-collect-backend
    metrics_path: /metrics
    static_configs:
      # Le backend NestJS tourne sur l'hôte (npm run start:dev), pas dans docker-compose —
      # seul Postgres y est conteneurisé. host.docker.internal (résolu via l'extra_host
      # host-gateway ci-dessous) permet au conteneur Prometheus d'atteindre l'hôte.
      # Port 3001 : voir backend/.env (PORT=3001, 3000 étant déjà pris par admin-web en dev).
      - targets: ['host.docker.internal:3001']
